app = "bunker-app"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.app"

[build.args]
  NEXT_PUBLIC_CHAIN_ID = "56"
  # Public RPC; a keyed endpoint can be passed with --build-arg NEXT_PUBLIC_RPC_URL=…
  # (it ends up in the browser bundle, so restrict the key by origin at the provider).
  NEXT_PUBLIC_RPC_URL = "https://bsc-dataseed.bnbchain.org"
  NEXT_PUBLIC_INDEXER_URL = "https://bunker-indexer.fly.dev"
  NEXT_PUBLIC_RELAYER_URL = "https://bunker-relayer.fly.dev"
  NEXT_PUBLIC_AGENTS_URL = "https://bunker-agents.fly.dev"
  # Contract addresses come from contracts/deployments/56.json at deploy time:
  #   --build-arg NEXT_PUBLIC_POOL_ADDRESS=0x… --build-arg NEXT_PUBLIC_LAUNCHPAD_ADDRESS=0x…
  NEXT_PUBLIC_SITE_URL = "https://bunkeronbnb.com"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
