name: android

# Builds the BUNKER Android app (mobile/) and publishes the APK.
# With the BUNKER_KEYSTORE_* secrets set the APK is a signed release build;
# without them it is a debug build, signed with the debug key, still installable.

on:
  push:
    branches: [main, launchpad]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: capacitor sync
        working-directory: mobile
        run: npm ci && npx cap sync android

      - name: keystore from secrets (if any)
        id: ks
        working-directory: mobile
        env:
          KEYSTORE_B64: ${{ secrets.BUNKER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bunker.keystore"
            echo "file=$RUNNER_TEMP/bunker.keystore" >> "$GITHUB_OUTPUT"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: assemble
        working-directory: mobile/android
        env:
          BUNKER_KEYSTORE_FILE: ${{ steps.ks.outputs.file }}
          BUNKER_KEYSTORE_PASSWORD: ${{ secrets.BUNKER_KEYSTORE_PASSWORD }}
          BUNKER_KEY_ALIAS: ${{ secrets.BUNKER_KEY_ALIAS }}
          BUNKER_KEY_PASSWORD: ${{ secrets.BUNKER_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.ks.outputs.variant }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/bunker-android.apk"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/bunker-android.apk"
          fi
          sha256sum "$RUNNER_TEMP/bunker-android.apk" | tee "$RUNNER_TEMP/bunker-android.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: bunker-android-${{ steps.ks.outputs.variant }}
          path: |
            ${{ runner.temp }}/bunker-android.apk
            ${{ runner.temp }}/bunker-android.apk.sha256

      - name: publish rolling prerelease
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: BUNKER for Android (latest)
          prerelease: true
          body: |
            Built from `${{ github.sha }}` (${{ steps.ks.outputs.variant }} build).
            Install the APK, open it, create a vault on the device, fund the built-in BNB account, shield.
            Verify with the `.sha256` file.
          files: |
            ${{ runner.temp }}/bunker-android.apk
            ${{ runner.temp }}/bunker-android.apk.sha256
