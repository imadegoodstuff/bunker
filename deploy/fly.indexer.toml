app = "bunker-indexer"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.service"
  [build.args]
    SERVICE = "indexer"

# Secrets: RPC_URL (keyed), RPC_URLS (comma-separated failover endpoints), POOL_ADDRESS, LAUNCHPAD_ADDRESS, START_BLOCK
[env]
  PORT = "8788"
  CHAIN_ID = "56"
  RPC_URL = "https://bsc-dataseed.bnbchain.org"
  # v2 revision 1 pool: fresh database (earlier files stay on the volume for reference)
  DB_PATH = "/data/bunker-indexer-v2r1.sqlite"
  # association set (SPEC section 10): roots are published on-chain by the relayer EOA; denylist = OFAC SDN (default source)
  ASP_PROVIDER = "0x45A8ACb8749b0F9F4feaE162fdb632b8fc36d3A0"
  # public BSC endpoints cap eth_getLogs ranges well below 2000 blocks
  SCAN_CHUNK = "400"
  RPC_URLS = "https://bsc-dataseed1.defibit.io,https://bsc.drpc.org,https://bsc-dataseed1.ninicoin.io"
  CONFIRMATIONS = "3"
  SCAN_INTERVAL_MS = "3000"
  # Launch metadata (token images + JSON) is written under /data/meta and served from PUBLIC_URL/meta/...
  META_DIR = "/data/meta"
  PUBLIC_URL = "https://bunker-indexer.fly.dev"
  META_UPLOADS_PER_HOUR = "20"

[mounts]
  source = "bunker_indexer_data"
  destination = "/data"

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/live"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
