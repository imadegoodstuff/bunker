app = "scash-indexer"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.service"
  [build.args]
    SERVICE = "indexer"

[env]
  PORT = "8788"
  # Public fallback; the keyed endpoint is a Fly secret of the same name (secrets override [env]).
  RPC_URL = "https://api.mainnet-beta.solana.com"
  # Comma-separated fallbacks tried after RPC_URL for every signature the primary
  # cannot return (SECURITY.md §14). Set via `flyctl secrets set RPC_URLS=…` when
  # the endpoints carry keys; empty means "primary only".
  # RPC_URLS = ""
  PROGRAM_ID = "89TrDDtwYTkrvxGmfYnSz6EbA1muGStuPBFUt3Dvd8WR"
  DB_PATH = "/data/scash-indexer.sqlite"
  SCAN_INTERVAL_MS = "4000"

[mounts]
  source = "scash_indexer_data"
  destination = "/data"

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/live"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
