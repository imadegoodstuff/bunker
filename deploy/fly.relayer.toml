app = "scash-relayer"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.service"
  [build.args]
    SERVICE = "relayer"

[env]
  PORT = "8787"
  RPC_URL = "https://api.devnet.solana.com"
  PROGRAM_ID = "A827Zi2VyPGQrPrQsZMr66hbxp7AaG2NdBYkV8Cj2yoJ"
  MIN_DELAY_MS = "5000"
  MAX_DELAY_MS = "90000"
  MIN_FEE_LAMPORTS = "1500000"
  # Priority fee bounds in micro-lamports/CU; the attached price follows recent
  # fees between them and the SOL fee floor is priced at CU_PRICE_MAX (SECURITY.md §14).
  CU_PRICE = "0"
  CU_PRICE_MAX = "20000"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/info"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
