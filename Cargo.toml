[workspace]
resolver = "2"
members = [
    "programs/scash_vault",
    "programs/scash_harvester",
    "programs/scash_migrator",
    "programs/scash_launch",
    "crates/scash-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lanqi0518-ux/scash"

[workspace.dependencies]
solana-program = "2.3"
solana-poseidon = "2.3"
groth16-solana = "0.2.0"
borsh = { version = "1.5", features = ["derive"] }
thiserror = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = 3
