name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_mainnet:
        description: "deploy the SBF artifacts of this commit to mainnet-beta and initialise the protocol (needs the mainnet environment secrets)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # Agave stable ships platform-tools with a rustc new enough for edition-2024 deps
  SOLANA_VERSION: stable

jobs:
  rust:
    name: rust (check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check || true
      - name: clippy (warnings are errors; solana's entrypoint cfgs and deprecated re-exports are allowed)
        run: cargo clippy --workspace --all-targets -- -D warnings -A unexpected_cfgs -A deprecated
      - run: cargo test --workspace --exclude scash-vault
      - name: vault unit tests (fixture tests need circuit artifacts)
        run: cargo test -p scash-vault --lib

  sbf:
    name: build SBF programs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: install solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - run: cargo build-sbf --manifest-path programs/scash_vault/Cargo.toml
      - run: cargo build-sbf --manifest-path programs/scash_harvester/Cargo.toml
      - run: cargo build-sbf --manifest-path programs/scash_migrator/Cargo.toml
      - run: cargo build-sbf --manifest-path programs/scash_launch/Cargo.toml
      - name: program sizes
        run: ls -la target/deploy/*.so
      - name: program digests (match these against the chain with scripts/verify-program.mjs)
        run: sha256sum target/deploy/*.so | tee target/deploy/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: programs
          path: target/deploy/*.so

  ts:
    name: sdk + circuits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run -w sdk build
      - run: npm run -w sdk test
      - name: indexer scanner (deferred v1 transactions, contiguous paging)
        run: npm run -w indexer test
      - name: agents tests
        run: npm run -w agents test
      - name: relayer queue (nullifier idempotency)
        run: npm run -w relayer test
      - name: compile circuits (constraint counts)
        run: npm run -w circuits build

  ceremony:
    name: phase-2 ceremony transcript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: rebuild circuits, download the pinned ptau
        run: |
          npm run -w circuits build
          node circuits/scripts/setup-dev.mjs
      - name: r1cs hashes, chain links, attestations, hosted zkeys verify against r1cs + ptau + transcript
        run: node circuits/scripts/ceremony.mjs check --fetch

  audit:
    name: audit tooling (cargo-audit, circomspect, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: cargo-audit (known vulnerabilities in Rust deps)
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: circomspect (static analysis; findings must be allow-listed in circuits/circomspect-allow.json)
        run: |
          cargo install circomspect --locked
          npm run -w circuits build
          node circuits/scripts/lint.mjs
      - name: npm audit (production deps; findings must be pinned via overrides or allow-listed in npm-audit-allow.json)
        run: node scripts/audit.mjs
      - name: audit package (every test reference in audit/INVARIANTS.md resolves)
        run: node scripts/audit-package-check.mjs
      - name: doc drift (SECURITY/SPEC/KNOWN_ISSUES state what the code does)
        run: node scripts/doc-drift-check.mjs

  e2e:
    name: end-to-end on a local validator
    needs: [sbf]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: programs
          path: target/deploy
      - name: install solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - run: npm ci
      - run: npm run -w sdk build
      - name: circuits + dev proving keys
        run: |
          npm run -w circuits build
          node circuits/scripts/setup-dev.mjs
          node circuits/scripts/export-vk.mjs
          # The dev setup is deterministic (pinned ptau + fixed entropy). If the
          # regenerated VK differs from the committed one, the program built in
          # the sbf job would reject every proof — fail loudly instead.
          git diff --exit-code --stat programs/scash_vault/src/vk || { echo "::error::VK drift: run setup-dev + export-vk and commit programs/scash_vault/src/vk"; exit 1; }
      - name: adversarial witness tests (every tampering must be unsatisfiable)
        run: npm run -w circuits test
      - name: start validator with the freshly built programs
        run: |
          mkdir -p keypairs
          solana-keygen new --no-bip39-passphrase --silent -o keypairs/deployer.json
          solana-test-validator --reset --quiet \
            --bpf-program 89TrDDtwYTkrvxGmfYnSz6EbA1muGStuPBFUt3Dvd8WR target/deploy/scash_vault.so \
            --bpf-program Cmvzy6Acq5QsnzpWGYEbUCwgzMK6AHFRJkAL2LgMURqK target/deploy/scash_harvester.so \
            --mint "$(solana-keygen pubkey keypairs/deployer.json)" &
          for i in $(seq 1 60); do solana cluster-version -u http://127.0.0.1:8899 >/dev/null 2>&1 && break; sleep 1; done
          solana cluster-version -u http://127.0.0.1:8899
      - name: e2e (shield → private send → unshield → donate → replay rejected)
        run: node scripts/e2e.mjs
      - name: bench (proving latency, concurrent transacts on one tree, 128-root window)
        run: set -o pipefail; node scripts/bench.mjs --n 140 --out bench.json | tee bench.log
      - uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: |
            bench.json
            bench.log
      - name: fresh validator with OLD vault, NEW vault (same binary, second id) and the migrator
        run: |
          pkill -f solana-test-validator || true
          sleep 2
          solana-test-validator --reset --quiet \
            --bpf-program 89TrDDtwYTkrvxGmfYnSz6EbA1muGStuPBFUt3Dvd8WR target/deploy/scash_vault.so \
            --bpf-program ${NEW_VAULT_ID} target/deploy/scash_vault.so \
            --bpf-program 42CGrJH6QGjHjH1CK9yQLF44UhrYjN9cQwGqVvrSYz4u target/deploy/scash_migrator.so \
            --mint "$(solana-keygen pubkey keypairs/deployer.json)" &
          for i in $(seq 1 60); do solana cluster-version -u http://127.0.0.1:8899 >/dev/null 2>&1 && break; sleep 1; done
        env:
          NEW_VAULT_ID: Ht494MDFWJ64tK6PvEctEEV5dUCCUHsgqSDPSt7Hat7k
      - name: migration e2e (old vault → PDA → new vault, no public wallet on the path)
        run: node scripts/migrate-e2e.mjs --new-vault Ht494MDFWJ64tK6PvEctEEV5dUCCUHsgqSDPSt7Hat7k
      - name: fresh validator with the vault, the launchpad and Raydium CP-Swap cloned from mainnet-beta
        run: |
          pkill -f solana-test-validator || true
          sleep 2
          # Raydium CP-Swap (program, fee config 0, creation-fee receiver) is cloned from mainnet-beta so
          # the migration e2e creates a real pool through the real program.
          for attempt in 1 2 3; do
            solana-test-validator --reset --quiet \
              --bpf-program 89TrDDtwYTkrvxGmfYnSz6EbA1muGStuPBFUt3Dvd8WR target/deploy/scash_vault.so \
              --bpf-program 861VJkPL2yUYL1DTCToeziREP4XyraihkqbTM1irFZ3k target/deploy/scash_launch.so \
              --url https://api.mainnet-beta.solana.com \
              --clone-upgradeable-program CPMMoo8L3F4NbTegBCKVNunggL7H1ZpdTHKxQB5qKP1C \
              --clone D4FPEruKEHrG5TenZ2mpDGEfu1iUvTiqBxvpU8HLBvC2 \
              --clone DNXgeM9EiiaAbaWvwjHj9fQQLAX5ZsfHyvmYUNRAdNC8 \
              --ticks-per-slot 16 \
              --mint "$(solana-keygen pubkey keypairs/deployer.json)" &
            for i in $(seq 1 90); do solana cluster-version -u http://127.0.0.1:8899 >/dev/null 2>&1 && break; sleep 1; done
            solana account -u http://127.0.0.1:8899 D4FPEruKEHrG5TenZ2mpDGEfu1iUvTiqBxvpU8HLBvC2 >/dev/null 2>&1 && break
            echo "clone from mainnet-beta failed (attempt $attempt); retrying"; pkill -f solana-test-validator || true; sleep 5
          done
          solana account -u http://127.0.0.1:8899 D4FPEruKEHrG5TenZ2mpDGEfu1iUvTiqBxvpU8HLBvC2 >/dev/null
      # --ticks-per-slot 16 makes a slot ≈ 100 ms so the 150-slot fee epoch passes in about 15 s
      - name: launchpad e2e (launch → agent votes → private buy → claim → harvest → private sell → claim → fee epoch rolls → graduation at 20 SOL → Raydium pool, LP burned; buyer wallet never appears)
        run: node scripts/launch-e2e.mjs

  # Manual, gated on the `mainnet` environment: deploys the four programs under the ids declared in
  # the source (the program keypairs are environment secrets), verifies the on-chain bytecode against
  # the artifact built by this very run, and initialises config/tree, the SOL pool, the launchpad and
  # the relayer lookup table (all idempotent). Programs stay upgradeable by the deployer until the
  # phase-2 ceremony's keys are the ones burned in (SECURITY.md §16).
  deploy-mainnet:
    name: deploy to mainnet-beta
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_mainnet
    needs: [rust, sbf, ts, e2e]
    runs-on: ubuntu-latest
    environment: mainnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: programs
          path: target/deploy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: deploy
        env:
          DEPLOYER_KEYPAIR: ${{ secrets.MAINNET_DEPLOYER_KEYPAIR }}
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          VAULT_PROGRAM_KEYPAIR: ${{ secrets.VAULT_PROGRAM_KEYPAIR }}
          HARVESTER_PROGRAM_KEYPAIR: ${{ secrets.HARVESTER_PROGRAM_KEYPAIR }}
          MIGRATOR_PROGRAM_KEYPAIR: ${{ secrets.MIGRATOR_PROGRAM_KEYPAIR }}
          LAUNCH_PROGRAM_KEYPAIR: ${{ secrets.LAUNCH_PROGRAM_KEYPAIR }}
        run: |
          if [ -z "$DEPLOYER_KEYPAIR" ]; then echo "MAINNET_DEPLOYER_KEYPAIR is not set"; exit 1; fi
          RPC="${RPC_URL:-https://api.mainnet-beta.solana.com}"
          mkdir -p keypairs
          echo "$DEPLOYER_KEYPAIR" > keypairs/deployer.json
          echo "$VAULT_PROGRAM_KEYPAIR" > keypairs/scash_vault-keypair.json
          echo "$HARVESTER_PROGRAM_KEYPAIR" > keypairs/scash_harvester-keypair.json
          echo "$MIGRATOR_PROGRAM_KEYPAIR" > keypairs/scash_migrator-keypair.json
          echo "$LAUNCH_PROGRAM_KEYPAIR" > keypairs/scash_launch-keypair.json
          # the keypairs must be the ids the source declares, or the PDAs every client derives are wrong
          for p in vault harvester migrator launch; do
            want=$(grep -o 'declare_id!("[^"]*")' programs/scash_$p/src/lib.rs | cut -d'"' -f2)
            have=$(solana-keygen pubkey keypairs/scash_$p-keypair.json)
            [ "$want" = "$have" ] || { echo "scash_$p keypair is $have, source declares $want"; exit 1; }
          done
          solana config set --url "$RPC" --keypair keypairs/deployer.json >/dev/null
          echo "deployer $(solana address) balance $(solana balance)"
          for p in vault harvester migrator launch; do
            solana program deploy target/deploy/scash_$p.so --program-id keypairs/scash_$p-keypair.json \
              --upgrade-authority keypairs/deployer.json --with-compute-unit-price 20000 --max-sign-attempts 60
          done
      - name: verify deployed bytecode equals the built artifact
        env:
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          RPC="${RPC_URL:-https://api.mainnet-beta.solana.com}"
          npm ci
          npm run -w sdk build
          for p in vault harvester migrator launch; do
            node scripts/verify-program.mjs "$(solana-keygen pubkey keypairs/scash_$p-keypair.json)" target/deploy/scash_$p.so --rpc "$RPC"
          done
      - name: initialise config, tree, SOL pool, launchpad, lookup table
        env:
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          RELAYER_PUBKEY: ${{ vars.MAINNET_RELAYER_PUBKEY }}
          TREASURY_PUBKEY: ${{ vars.MAINNET_TREASURY_PUBKEY }}
          AGENT_PUBKEYS: ${{ vars.MAINNET_AGENT_PUBKEYS }}
          LOOKUP_TABLE: ${{ vars.MAINNET_LOOKUP_TABLE }}
          TVL_CAP_SOL: ${{ vars.MAINNET_TVL_CAP_SOL }}
        run: |
          RPC="${RPC_URL:-https://api.mainnet-beta.solana.com}"
          set -- --keypair keypairs/deployer.json --rpc "$RPC" --tvl-cap-sol "${TVL_CAP_SOL:-1000}"
          [ -n "$RELAYER_PUBKEY" ] && set -- "$@" --relayer "$RELAYER_PUBKEY"
          [ -n "$TREASURY_PUBKEY" ] && set -- "$@" --treasury "$TREASURY_PUBKEY"
          [ -n "$AGENT_PUBKEYS" ] && set -- "$@" --agents "$AGENT_PUBKEYS"
          [ -n "$LOOKUP_TABLE" ] && set -- "$@" --lookup-table "$LOOKUP_TABLE"
          node scripts/init.mjs "$@"
      - name: scrub keypairs
        if: always()
        run: rm -rf keypairs
