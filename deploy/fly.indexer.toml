app = "scash-indexer"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.service"
  [build.args]
    SERVICE = "indexer"

[env]
  PORT = "8788"
  RPC_URL = "https://api.devnet.solana.com"
  PROGRAM_ID = "A827Zi2VyPGQrPrQsZMr66hbxp7AaG2NdBYkV8Cj2yoJ"
  DB_PATH = "/data/scash-indexer.sqlite"
  SCAN_INTERVAL_MS = "4000"

[mounts]
  source = "scash_indexer_data"
  destination = "/data"

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
