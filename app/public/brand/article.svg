<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="v" cx="0.5" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#121214"/>
      <stop offset="1" stop-color="#09090a"/>
    </radialGradient>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8a90"/>
    </marker>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8a75c"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#v)"/>

  <!-- title row -->
  <g transform="translate(80 56) scale(0.75)">
    <rect width="64" height="64" rx="14" fill="#0a0a0a" stroke="#242428" stroke-width="0.75"/>
    <path d="M42 22c-2-4-6-6-10-6-6 0-11 3.5-11 9 0 5 4 7 10 8.5 5 1.2 7 2.2 7 4.5 0 2.6-2.8 4-6 4-4 0-7-2-9-5" fill="none" stroke="#ededed" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <text x="142" y="90" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500" fill="#ededed">scash</text>
  <text x="222" y="90" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#8a8a90">how a private launch works</text>
  <text x="1520" y="90" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" letter-spacing="2" fill="#6b6b72">THREE PROGRAMS, FOUR AGENTS, NO ADMIN</text>

  <!-- ===== column 1: wallet ===== -->
  <g transform="translate(80 200)">
    <rect width="260" height="150" rx="22" fill="#0e0e10" stroke="#2a2a2e"/>
    <text x="24" y="40" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="2" fill="#6b6b72">PUBLIC</text>
    <text x="24" y="80" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="500" fill="#ededed">Your wallet</text>
    <text x="24" y="114" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#8a8a90">SOL or any token</text>
  </g>
  <line x1="340" y1="275" x2="430" y2="275" stroke="#8a8a90" stroke-width="1.8" marker-end="url(#m)"/>
  <text x="385" y="262" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="1" fill="#8a8a90">shield</text>

  <!-- ===== column 2: shielded pool ===== -->
  <g transform="translate(440 150)">
    <rect width="380" height="420" rx="26" fill="#0e0e10" stroke="#3a3a40"/>
    <text x="28" y="44" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="2" fill="#e8a75c">SHIELDED POOL</text>
    <text x="28" y="86" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="500" fill="#ededed">scash_vault</text>
    <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#bdbdc4">
      <text x="28" y="134">Sapling notes, BabyJubjub keys</text>
      <text x="28" y="166">Groth16 proofs made in the browser</text>
      <text x="28" y="198">Merkle tree depth 26, 128-root ring</text>
      <text x="28" y="230">Nullifier = one-byte PDA</text>
      <text x="28" y="262">Share-based pools, yield by donation</text>
    </g>
    <rect x="28" y="296" width="324" height="92" rx="16" fill="#141416" stroke="#2a2a2e"/>
    <text x="48" y="330" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="2" fill="#6b6b72">TURNSTILE</text>
    <text x="48" y="366" font-family="'JetBrains Mono', Consolas, monospace" font-size="22" fill="#ededed">total out &#8804; total in</text>
  </g>

  <!-- exit arrow -->
  <line x1="820" y1="300" x2="930" y2="300" stroke="#e8a75c" stroke-width="2" marker-end="url(#ma)"/>
  <text x="875" y="286" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" letter-spacing="1" fill="#e8a75c">private trade</text>
  <text x="875" y="322" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#8a8a90">throwaway claim key</text>

  <!-- ===== column 3: launchpad ===== -->
  <g transform="translate(940 150)">
    <rect width="360" height="300" rx="26" fill="#0e0e10" stroke="#3a3a40"/>
    <text x="28" y="44" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="2" fill="#e8a75c">PRIVATE LAUNCHPAD</text>
    <text x="28" y="86" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="500" fill="#ededed">scash_launch</text>
    <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#bdbdc4">
      <text x="28" y="134">Token-2022 mint, no authorities</text>
      <text x="28" y="166">Constant-product curve</text>
      <text x="28" y="198">Tax 0 to 5 %, agent-voted</text>
      <text x="28" y="230">Graduates at 20 SOL</text>
    </g>
    <text x="28" y="272" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#6b6b72">on-chain: curve, amount, a key seen once</text>
  </g>

  <!-- graduation -->
  <line x1="1300" y1="300" x2="1400" y2="300" stroke="#8a8a90" stroke-width="1.8" marker-end="url(#m)"/>
  <g transform="translate(1400 255)">
    <rect width="120" height="90" rx="18" fill="#0e0e10" stroke="#2a2a2e"/>
    <text x="60" y="40" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#ededed">Raydium</text>
    <text x="60" y="66" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" letter-spacing="1" fill="#6b6b72">AUTO</text>
  </g>

  <!-- tax down to treasury -->
  <line x1="1120" y1="450" x2="1120" y2="540" stroke="#e8a75c" stroke-width="2" marker-end="url(#ma)"/>
  <text x="1140" y="500" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="1" fill="#e8a75c">tax</text>

  <!-- ===== agents row ===== -->
  <g transform="translate(940 550)">
    <rect width="580" height="270" rx="26" fill="#0e0e10" stroke="#3a3a40"/>
    <text x="28" y="44" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="2" fill="#e8a75c">FOUR AGENTS, ONE TREASURY</text>
    <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#bdbdc4">
      <g transform="translate(28 70)">
        <rect width="120" height="56" rx="14" fill="#141416" stroke="#2a2a2e"/>
        <text x="60" y="24" text-anchor="middle" fill="#ededed">Agent A</text><text x="60" y="44" text-anchor="middle" font-size="12" fill="#6b6b72">growth</text>
      </g>
      <g transform="translate(160 70)">
        <rect width="120" height="56" rx="14" fill="#141416" stroke="#2a2a2e"/>
        <text x="60" y="24" text-anchor="middle" fill="#ededed">Agent B</text><text x="60" y="44" text-anchor="middle" font-size="12" fill="#6b6b72">revenue</text>
      </g>
      <g transform="translate(292 70)">
        <rect width="120" height="56" rx="14" fill="#141416" stroke="#2a2a2e"/>
        <text x="60" y="24" text-anchor="middle" fill="#ededed">Agent C</text><text x="60" y="44" text-anchor="middle" font-size="12" fill="#6b6b72">contrarian</text>
      </g>
      <g transform="translate(424 70)">
        <rect width="120" height="56" rx="14" fill="#141416" stroke="#2a2a2e"/>
        <text x="60" y="24" text-anchor="middle" fill="#ededed">Agent D</text><text x="60" y="44" text-anchor="middle" font-size="12" fill="#6b6b72">cautious</text>
      </g>
    </g>
    <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#bdbdc4">
      <text x="28" y="168">Vote once a minute. Median of fresh votes, one 1 % step per epoch, quorum of 2.</text>
      <text x="28" y="198">Treasury fuels the keys, then buys back $SCASH at random intervals</text>
      <text x="28" y="228">and burns it, or airdrops it to holders. No human in the loop.</text>
    </g>
  </g>

  <!-- harvest arrow back to pool -->
  <path d="M940 700 L700 700 L700 572" fill="none" stroke="#8a8a90" stroke-width="1.8" marker-end="url(#m)"/>
  <text x="815" y="688" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="1" fill="#8a8a90">harvest</text>
  <text x="815" y="720" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6b6b72">yield to every shielded SOL holder</text>

  <!-- what does not exist -->
  <g transform="translate(80 600)">
    <text x="0" y="0" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="2" fill="#6b6b72">WHAT DOES NOT EXIST</text>
    <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#bdbdc4">
      <circle cx="6" cy="36" r="3.5" fill="#e8a75c"/><text x="22" y="42">Admin key</text>
      <circle cx="6" cy="72" r="3.5" fill="#e8a75c"/><text x="22" y="78">Pause switch over withdrawals</text>
      <circle cx="6" cy="108" r="3.5" fill="#e8a75c"/><text x="22" y="114">Multisig over funds</text>
      <circle cx="6" cy="144" r="3.5" fill="#e8a75c"/><text x="22" y="150">Protocol fee</text>
      <circle cx="6" cy="180" r="3.5" fill="#e8a75c"/><text x="22" y="186">Anyone who can see who traded</text>
    </g>
  </g>

  <text x="80" y="862" font-family="'JetBrains Mono', Consolas, monospace" font-size="18" letter-spacing="1" fill="#ededed">scash.site</text>
  <text x="1520" y="862" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" letter-spacing="2" fill="#6b6b72">OPEN SOURCE / BYTECODE VERIFIED</text>
</svg>
