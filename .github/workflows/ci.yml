name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_bsc:
        description: "deploy the contracts of this commit to BNB Smart Chain mainnet (needs the bsc environment secrets)"
        type: boolean
        default: false

jobs:
  contracts:
    name: contracts (compile + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: compile (solc 0.8.28, viaIR) and export ABIs
        run: npm run -w contracts build
      - name: ABIs in the SDK match the compiled contracts
        run: git diff --exit-code --stat sdk/src/abi || { echo "::error::ABI drift: run npm run -w contracts build and commit sdk/src/abi"; exit 1; }
      - name: pool + launchpad unit tests (hardhat)
        run: npm run -w contracts test

  ts:
    name: sdk + services + circuits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run -w sdk build
      - run: npm run -w sdk test
      - name: indexer scanner (block-range paging, failover, event ingest)
        run: npm run -w indexer test
      - name: agents tests
        run: npm run -w agents test
      - name: relayer (fee oracle, queue idempotency)
        run: npm run -w relayer test
      - name: compile circuits (constraint counts)
        run: npm run -w circuits build
      - name: app type-check
        run: npx tsc --noEmit -p app

  ceremony:
    name: phase-2 ceremony transcript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: rebuild circuits, download the pinned ptau
        run: |
          npm run -w circuits build
          node circuits/scripts/setup-dev.mjs
      - name: r1cs hashes, chain links, attestations, hosted zkeys verify against r1cs + ptau + transcript
        run: node circuits/scripts/ceremony.mjs check --fetch

  audit:
    name: audit tooling (circomspect, npm audit, doc drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: circomspect (static analysis; findings must be allow-listed in circuits/circomspect-allow.json)
        run: |
          cargo install circomspect --locked
          npm run -w circuits build
          node circuits/scripts/lint.mjs
      - name: npm audit (production deps; findings must be pinned via overrides or allow-listed in npm-audit-allow.json)
        run: node scripts/audit.mjs
      - name: audit package (every test reference in audit/INVARIANTS.md resolves)
        run: node scripts/audit-package-check.mjs
      - name: doc drift (SECURITY/SPEC/KNOWN_ISSUES state what the code does)
        run: node scripts/doc-drift-check.mjs

  e2e:
    name: end-to-end on a Hardhat node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run -w sdk build
      - name: circuits + dev proving keys
        run: |
          npm run -w circuits build
          node circuits/scripts/setup-dev.mjs
      - name: Solidity verifiers match the dev keys
        run: |
          npm run -w contracts verifiers
          # The dev setup is deterministic (pinned ptau + fixed entropy). If the regenerated
          # verifier differs from the committed one, the deployed contract would reject every proof.
          git diff --exit-code --stat contracts/contracts/verifiers || { echo "::error::verifier drift: run setup-dev + contracts verifiers and commit"; exit 1; }
      - name: adversarial witness tests (every tampering must be unsatisfiable)
        run: npm run -w circuits test
      - run: npm run -w contracts build
      - name: e2e (shield → private send → unshield → donate → replay rejected → launch → private buy/claim → votes/fee roll → private sell/claim → graduation → PancakeSwap migration)
        run: node scripts/e2e.mjs --spawn

  # Manual, gated on the `bsc` environment: deploys the contracts of this commit to BNB Smart Chain
  # mainnet with the deployer key held as an environment secret and uploads deployments/56.json.
  deploy-bsc:
    name: deploy to BNB Smart Chain
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_bsc
    needs: [contracts, ts, e2e]
    runs-on: ubuntu-latest
    environment: bsc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run -w contracts build
      - name: deploy
        env:
          DEPLOYER_KEY: ${{ secrets.BSC_DEPLOYER_KEY }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          TREASURY: ${{ vars.BSC_TREASURY }}
          AGENTS: ${{ vars.BSC_AGENTS }}
          GUARDIAN: ${{ vars.BSC_GUARDIAN }}
          GRADUATION_BNB: ${{ vars.BSC_GRADUATION_BNB }}
        run: |
          if [ -z "$DEPLOYER_KEY" ]; then echo "BSC_DEPLOYER_KEY is not set"; exit 1; fi
          npm run -w contracts deploy:bsc
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-56
          path: contracts/deployments/56.json
      - name: verify on BscScan
        if: ${{ secrets.BSCSCAN_API_KEY != '' }}
        env:
          BSCSCAN_API_KEY: ${{ secrets.BSCSCAN_API_KEY }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
        run: node contracts/scripts/verify.cjs
