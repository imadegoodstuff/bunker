app = "bunker-relayer"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.service"
  [build.args]
    SERVICE = "relayer"

# Secrets (set with `flyctl secrets set`, never in this file):
#   RELAYER_KEY        hex private key of the relayer EOA (fund it with BNB; it pays gas and is repaid from notes)
#   RPC_URL            keyed endpoint, overrides the public fallback below
#   POOL_ADDRESS, LAUNCHPAD_ADDRESS   from contracts/deployments/56.json (set as secrets or edit [env])
[env]
  PORT = "8787"
  CHAIN_ID = "56"
  RPC_URL = "https://bsc-dataseed.bnbchain.org"
  PANCAKE_ROUTER = "0x10ED43C718714eb63d5aA57B78B54704E256024E"
  WBNB = "0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c"
  MIN_DELAY_MS = "5000"
  MAX_DELAY_MS = "90000"
  # BNB fee floor in pool units (gwei): 0.0003 BNB; the effective floor is max(this, GAS_LIMIT × GAS_PRICE_CAP × margin)
  MIN_FEE_UNITS = "300000"
  GAS_PRICE_FLOOR_GWEI = "0.1"
  # BSC has run at ~0.05 gwei since 2025; a 1 gwei cap keeps the fee floor near 0.002 BNB with 20x headroom
  GAS_PRICE_CAP_GWEI = "1"
  GAS_LIMIT = "1600000"
  COST_MARGIN_BPS = "2000"
  # price any ERC-20 with a pool through PancakeSwap (margin on top of the BNB cost)
  DYNAMIC_ASSETS = "1"
  DYNAMIC_MARGIN_BPS = "5000"
  DYNAMIC_FEE_BPS = "5"
  # protocol v2: fee notes are shielded; the sweeper proves them back to the EOA using these artifacts and the indexer
  INDEXER_URL = "https://bunker-indexer.fly.dev"
  ARTIFACTS_DIR = "/repo/circuits"
  # drain keeper: fold queued leaves into the tree after this long or at this many leaves
  DRAIN_AFTER_MS = "15000"
  DRAIN_AT = "32"
  # signed transactions leave through a private endpoint (48 Club), never the public mempool; reads stay on RPC_URL
  SUBMIT_RPC_URL = "https://rpc-bsc.48.club"
  # several due transacts go out as one transactBatch
  BATCH_MAX = "4"
  # association set: publish the indexer's root from this EOA; membership proofs stay optional
  ASP_PUBLISH = "1"
  ASP_REQUIRED = "0"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  # the sweeper proves transact circuits in-process (snarkjs); 512mb is the floor for that
  memory = "512mb"
