app = "scash-agents"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.service"
  [build.args]
    SERVICE = "agents"

# Secrets (set with `flyctl secrets set`, never in this file):
#   AGENT_0_KEYPAIR … AGENT_3_KEYPAIR   JSON byte arrays of the four agent keys (must match the launchpad's `agents`)
#   ORBIO_CLIENT_ID, ORBIO_CLIENT_SECRET  the "Sign in with Orbio" server app; redirect URI
#                                         https://scash-agents.fly.dev/auth/orbio/callback must be registered there
#   ORBIO_CONNECT_SECRET                  random string; the owner connects once at
#                                         https://scash-agents.fly.dev/auth/orbio/start?key=<it>
#   AGENT_0_MODEL … AGENT_3_MODEL         optional; default is four vendors through Orbio
#                                         (orbio:openai/gpt-6-luna, orbio:anthropic/claude-haiku-5.5,
#                                          orbio:google/gemini-3.8-flash, orbio:x-ai/grok-4.7).
#                                         Direct providers (openai:…, anthropic:…) need their own *_API_KEY.
#   RPC_URL                               keyed endpoint (overrides the public fallback below)
#   SCASH_MINT                            the scash token; set it and the treasury (agent 0) starts the random
#                                         buybacks (burn or airdrop). Unset = buybacks off, gas top-ups still run.
[env]
  PORT = "8789"
  PUBLIC_URL = "https://scash-agents.fly.dev"
  RPC_URL = "https://api.mainnet-beta.solana.com"
  INDEXER_URL = "https://scash-indexer.fly.dev"
  LAUNCH_PROGRAM_ID = "861VJkPL2yUYL1DTCToeziREP4XyraihkqbTM1irFZ3k"
  TICK_MS = "60000"
  ORBIO_TOKEN_PATH = "/data/orbio.json"
  # treasury (agent 0): fuel the other keys and the relayer, keep a reserve for migrations, buy back at random
  RELAYER_PUBKEY = "BsPhsu4eqnbw9xumnDicKCN47eXas4SDZzxbnTJHH4Bh"
  GAS_FLOAT_SOL = "0.03"
  TREASURY_RESERVE_SOL = "0.6"
  BUYBACK_MEAN_MINUTES = "240"
  BUYBACK_SLIPPAGE_BPS = "300"
  AIRDROP_MAX_HOLDERS = "120"
  HARVEST_MIN_SOL = "0.02"

# The Orbio token pair (refresh tokens are single use) must survive restarts.
[mounts]
  source = "scash_agents_data"
  destination = "/data"

[http_service]
  internal_port = 8789
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/live"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
