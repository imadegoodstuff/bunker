<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="v" cx="0.2" cy="0.3" r="1.1">
      <stop offset="0" stop-color="#141416"/>
      <stop offset="1" stop-color="#09090a"/>
    </radialGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8a75c"/>
      <stop offset="1" stop-color="#e8a75c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#v)"/>
  <g fill="none" stroke="#1d1d21" stroke-width="1">
    <path d="M0 150 H1600 M0 750 H1600"/>
    <path d="M96 0 V900 M1504 0 V900"/>
  </g>

  <!-- brand -->
  <g transform="translate(96 60) scale(1.0)">
    <rect width="64" height="64" rx="14" fill="#0a0a0a" stroke="#242428" stroke-width="0.75"/>
    <path d="M42 22c-2-4-6-6-10-6-6 0-11 3.5-11 9 0 5 4 7 10 8.5 5 1.2 7 2.2 7 4.5 0 2.6-2.8 4-6 4-4 0-7-2-9-5" fill="none" stroke="#ededed" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <text x="178" y="104" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="500" letter-spacing="-1" fill="#ededed">scash</text>
  <text x="1504" y="100" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" letter-spacing="3" fill="#6b6b72">SOLANA MAINNET</text>

  <!-- headline -->
  <text font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="500" letter-spacing="-3" fill="#ededed">
    <tspan x="96" y="270">Solana's first shielded pool,</tspan>
    <tspan x="96" y="352">with a private launchpad</tspan>
    <tspan x="96" y="434" fill="#8a8a90">built in.</tspan>
  </text>
  <rect x="96" y="470" width="260" height="2" fill="url(#hl)"/>

  <!-- intro -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#bdbdc4">
    <text x="96" y="540">Deposit SOL or any token in your wallet. Your proof is generated in the browser,</text>
    <text x="96" y="578">your note lives on-chain, and withdrawals go through a relayer, so no wallet</text>
    <text x="96" y="616">ever links the two sides. Tokens launch on a private curve where buys and sells</text>
    <text x="96" y="654">settle through the pool, and a tax set by four autonomous agents pays yield to</text>
    <text x="96" y="692">every shielded SOL holder and buys back $SCASH. At 20 SOL, it graduates to Raydium.</text>
  </g>

  <!-- tiles -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <g transform="translate(1104 190)">
      <rect width="400" height="118" rx="18" fill="#0d0d0f" stroke="#242428"/>
      <text x="24" y="38" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="3" fill="#e8a75c">GOVERNANCE</text>
      <text x="24" y="84" font-size="30" font-weight="500" letter-spacing="-1" fill="#ededed">No admin key. No pause.</text>
    </g>
    <g transform="translate(1104 322)">
      <rect width="400" height="118" rx="18" fill="#0d0d0f" stroke="#242428"/>
      <text x="24" y="38" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="3" fill="#e8a75c">FEES</text>
      <text x="24" y="84" font-size="30" font-weight="500" letter-spacing="-1" fill="#ededed">Zero protocol fee.</text>
    </g>
    <g transform="translate(1104 454)">
      <rect width="400" height="118" rx="18" fill="#0d0d0f" stroke="#242428"/>
      <text x="24" y="38" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="3" fill="#e8a75c">LAUNCH TAX</text>
      <text x="24" y="84" font-size="30" font-weight="500" letter-spacing="-1" fill="#ededed">0 to 5 %, voted by 4 agents.</text>
    </g>
    <g transform="translate(1104 586)">
      <rect width="400" height="118" rx="18" fill="#0d0d0f" stroke="#242428"/>
      <text x="24" y="38" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="3" fill="#e8a75c">INVARIANT</text>
      <text x="24" y="84" font-family="'JetBrains Mono', Consolas, monospace" font-size="28" fill="#ededed">total out &#8804; total in</text>
    </g>
  </g>

  <!-- footer -->
  <text x="96" y="810" font-family="'JetBrains Mono', Consolas, monospace" font-size="24" letter-spacing="1" fill="#ededed">scash.site</text>
  <text x="1504" y="810" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" letter-spacing="3" fill="#6b6b72">OPEN SOURCE / BYTECODE VERIFIED / NOBODY IN THE LOOP</text>
</svg>
